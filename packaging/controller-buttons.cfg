# Game PS2 button index = SDL GameController name (derived from the MIT patch).
# Actions use original default.key or a transformed modern/southpaw binding set.
deadzone=0.22
trigger_threshold=0.15
0=y
1=b
2=a
3=x
4=lefttrigger
5=righttrigger
6=leftshoulder
7=rightshoulder
8=back
9=leftstick
10=rightstick
11=start
12=dpup
13=dpright
14=dpdown
15=dpleft
